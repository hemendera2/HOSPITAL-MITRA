name: hospital_mitra
description: "Hospital Mitra — AI-powered indoor hospital navigation for patients and visitors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.0
  dio: ^5.7.0
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.4
  mobile_scanner: ^5.2.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3
  geocoding: ^4.0.0
  google_maps_flutter: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.5.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/l10n/
    - assets/images/
